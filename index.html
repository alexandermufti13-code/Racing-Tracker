<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Alexander's Playbook · 2026 Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Geist';
      src: url('https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/Geist-Bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --bg:       #0a0f0c;
      --bg2:      #0f1712;
      --bg3:      #141d17;
      --bg4:      #1a2620;
      --line:     #1f2e24;
      --line2:    #2a3d30;
      --gold:     #d4a843;
      --gold2:    #f0c860;
      --gold-dim: rgba(212,168,67,0.08);
      --gold-mid: rgba(212,168,67,0.18);
      --green:    #2ecc71;
      --red:      #e74c3c;
      --blue:     #5dade2;
      --text:     #e6f3e9;
      --text2:    #b6ccb9;
      --text3:    #86a78f;
      --g1:       #d4a843;
      --g2:       #9ab0b8;
      --g3:       #b87a3a;
      --mono:     'IBM Plex Mono', monospace;
      --sans:     'IBM Plex Sans', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
    html { font-size: 13px; }
    body {
      font-family: var(--mono);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 44px;
    }
    body::after {
      content:'';
      position:fixed; inset:0;
      background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.025) 2px,rgba(0,0,0,0.025) 4px);
      pointer-events:none; z-index:999;
    }

    /* TOP BAR */
    .topbar {
      background: var(--bg2);
      border-bottom: 1px solid var(--line);
      padding: 0 20px;
      display: flex;
      align-items: center;
      height: 36px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar-brand {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding-right: 20px;
      border-right: 1px solid var(--line);
      white-space: nowrap;
    }
    .topbar-meta {
      display: flex;
      align-items: center;
      gap: 20px;
      padding-left: 20px;
      flex: 1;
      overflow: hidden;
    }
    .topbar-item {
      font-size: 0.68rem;
      color: var(--text2);
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .topbar-item span { color: var(--gold); }
    .topbar-live {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.65rem;
      color: var(--green);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .dot-live {
      width: 5px; height: 5px;
      background: var(--green);
      border-radius: 50%;
      animation: blink 1.4s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.2;} }

    /* HEADER */
    .site-header {
      padding: 28px 20px 20px;
      border-bottom: 2px solid var(--line);
      background: var(--bg2);
    }
    .header-row1 { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
    .header-title {
      font-family: var(--sans);
      font-size: clamp(1.5rem, 4vw, 2.4rem);
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .header-title em { font-style:normal; color:var(--gold); }
    .header-tag {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text3);
      border: 1px solid var(--line2);
      border-radius: 2px;
      padding: 2px 6px;
    }
    .header-desc {
      margin-top: 8px;
      font-size: 0.75rem;
      color: var(--text2);
      font-style: italic;
      letter-spacing: 0.03em;
    }

    /* STATS */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      border-bottom: 1px solid var(--line);
      background: var(--bg2);
    }
    .stat-cell {
      padding: 14px 16px;
      border-right: 1px solid var(--line);
    }
    .stat-cell:last-child { border-right: none; }
    .stat-key {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text3);
      margin-bottom: 4px;
    }
    .stat-val {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--gold);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .stat-val.green { color: var(--green); }
    .stat-val.dim   { color: var(--text2); font-size: 1.1rem; }
    .stat-sub {
      font-size: 0.62rem;
      color: var(--text3);
      margin-top: 4px;
      letter-spacing: 0.04em;
      line-height: 1.35;
    }
    .stat-sub span { color: var(--text2); }
    .stat-sub.dim-line { margin-top: 2px; font-size: 0.58rem; }
    .stat-cell--link { cursor: pointer; }
    .stat-cell--link:hover .stat-val { color: var(--gold2); }
    .stat-cell--link:hover .stat-key { color: var(--text2); }

    /* TABS */
    .section-tabs {
      display: flex;
      background: var(--bg2);
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .section-tabs::-webkit-scrollbar { display:none; }
    .stab {
      appearance: none;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text3);
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 10px 18px;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
    }
    .stab:hover { color: var(--text); }
    .stab.active { color: var(--gold); border-bottom-color: var(--gold); background: var(--gold-dim); }
    .stab-count {
      display: inline-block;
      margin-left: 5px;
      font-size: 0.6rem;
      color: var(--text3);
      background: var(--bg3);
      border-radius: 2px;
      padding: 1px 4px;
    }
    .stab.active .stab-count { color: var(--gold); background: var(--gold-mid); }

    /* CONVICTION BUYS PANEL */
    .conviction-panel {
      --cb-bg: #0a130d;
      --cb-gold: #d8ab4f;
      --cb-green: #5fae84;
      --cb-text: #e9ead9;
      --cb-muted: #8a9a8c;
      --cb-dim: #566256;
      background: linear-gradient(135deg, rgba(95,174,132,0.05) 0%, transparent 55%), var(--cb-bg);
      border: 1px solid rgba(200,180,120,0.22);
      border-radius: 12px;
      margin: 16px 20px 16px;
      padding: 20px 22px 18px;
      color: var(--cb-text);
      font-family: 'DM Mono', var(--mono);
    }
    .conviction-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .conviction-eyebrow {
      font-size: 0.58rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--cb-gold);
    }
    .conviction-caption {
      font-size: 0.58rem;
      letter-spacing: 0.08em;
      color: var(--cb-muted);
      text-align: right;
      white-space: nowrap;
    }
    .conviction-lead {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: clamp(1rem, 2.2vw, 1.15rem);
      font-style: italic;
      font-weight: 400;
      line-height: 1.5;
      color: var(--cb-text);
      margin-bottom: 20px;
      max-width: 720px;
    }
    .conviction-lead strong {
      font-weight: 400;
      color: var(--cb-gold);
    }
    .conviction-scores {
      display: flex;
      align-items: flex-end;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 22px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(200,180,120,0.12);
    }
    .conviction-score { min-width: 0; }
    .conviction-score--slot { opacity: 0.55; }
    .conviction-figure {
      font-family: 'Geist', var(--sans);
      font-size: clamp(2rem, 5vw, 2.6rem);
      font-weight: 700;
      line-height: 1;
      color: var(--cb-text);
      font-variant-numeric: tabular-nums;
    }
    .conviction-figure--green { color: var(--cb-green); }
    .conviction-figure--dim {
      color: var(--cb-dim);
      border: 1px dashed rgba(86,98,86,0.65);
      border-radius: 8px;
      width: 2.2em;
      height: 1.4em;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.6rem, 4vw, 2rem);
    }
    .conviction-score-label {
      margin-top: 6px;
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--cb-muted);
      max-width: 120px;
      line-height: 1.35;
    }
    .conviction-score--slot .conviction-score-label { color: var(--cb-dim); }
    .conviction-arrow {
      font-size: 1.25rem;
      color: var(--cb-muted);
      padding-bottom: 22px;
      line-height: 1;
    }
    .conviction-arrow--dim { color: var(--cb-dim); opacity: 0.5; }
    .conviction-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0;
      margin-bottom: 16px;
    }
    .conviction-pick {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 11px 0;
      border-bottom: 1px solid rgba(200,180,120,0.1);
    }
    .conviction-pick:last-child { border-bottom: none; }
    .conviction-pick--pending { opacity: 0.45; }
    .conviction-pick-main { min-width: 0; }
    .conviction-pick-name {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--cb-text);
      margin-bottom: 2px;
    }
    .conviction-pick--pending .conviction-pick-name {
      font-weight: 400;
      font-size: 0.72rem;
      color: var(--cb-muted);
      font-style: italic;
    }
    .conviction-pick-detail {
      display: block;
      font-size: 0.68rem;
      color: var(--cb-muted);
      font-style: italic;
    }
    .conviction-badge {
      flex-shrink: 0;
      font-size: 0.55rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--cb-gold);
      border: 1px solid rgba(216,171,79,0.45);
      border-radius: 3px;
      padding: 3px 7px;
      white-space: nowrap;
    }
    .conviction-badge--pending {
      color: var(--cb-dim);
      border-style: dashed;
      border-color: rgba(86,98,86,0.55);
    }
    .conviction-footer {
      font-size: 0.62rem;
      color: var(--cb-dim);
      letter-spacing: 0.04em;
      line-height: 1.5;
      padding-top: 4px;
    }

    .sales-section-intro {
      padding: 12px 20px;
      background: var(--bg2);
      border-bottom: 1px solid var(--line);
      font-size: 0.7rem;
      color: var(--text3);
      letter-spacing: 0.03em;
      line-height: 1.45;
    }

    td.rerate { font-variant-numeric: tabular-nums; text-align: right; min-width: 88px; font-weight: 500; font-size: 0.76rem; }
    td.rerate.up { color: var(--green); }
    td.rerate.down { color: var(--red); }
    td.rerate.flat { color: var(--text3); font-weight: 400; }
    td.called-date { color: var(--text2); font-size: 0.72rem; min-width: 88px; }
    td.market-col { color: var(--gold); font-variant-numeric: tabular-nums; font-size: 0.74rem; }
    td.owner-change { font-size: 0.7rem; color: var(--text2); white-space: normal; min-width: 200px; max-width: 240px; line-height: 1.35; }
    td.owner-change .owner-was { color: var(--text3); }
    td.owner-change .owner-arrow { color: var(--text3); }
    td.owner-change .owner-now { color: var(--text); }

    /* SORT BAR */
    .sort-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      background: var(--bg2);
      border-bottom: 1px solid var(--line);
    }
    .sort-bar-label {
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text3);
      margin-right: 4px;
    }
    .sort-btn {
      appearance: none;
      background: var(--bg3);
      border: 1px solid var(--line2);
      color: var(--text2);
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 2px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .sort-btn:hover { color: var(--text); border-color: var(--text3); }
    .sort-btn.active {
      color: var(--gold);
      border-color: rgba(212,168,67,0.45);
      background: var(--gold-dim);
    }

    /* TABLE */
    .section { display: none; }
    .section.active { display: block; }
    .table-wrap {
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-gutter: stable both-edges;
      border-top: 1px solid var(--line);
    }

    table {
      width: max-content;
      min-width: max(100%, 1570px);
      border-collapse: collapse;
      font-size: 0.78rem;
    }
    .table-wrap::-webkit-scrollbar { height: 10px; }
    .table-wrap::-webkit-scrollbar-track { background: var(--bg3); }
    .table-wrap::-webkit-scrollbar-thumb {
      background: var(--line2);
      border-radius: 999px;
      border: 2px solid var(--bg3);
    }
    .table-wrap::-webkit-scrollbar-thumb:hover { background: var(--text3); }
    .bottom-scroll {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 120;
      background: var(--bg2);
      border-top: 1px solid var(--line2);
      padding: 6px 12px 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .bottom-scroll-label {
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text3);
      white-space: nowrap;
      user-select: none;
    }
    .bottom-scroll-range {
      flex: 1;
      width: 100%;
      appearance: none;
      height: 8px;
      border-radius: 999px;
      background: var(--bg3);
      border: 1px solid var(--line2);
      outline: none;
    }
    .bottom-scroll-range::-webkit-slider-thumb {
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--gold);
      border: 2px solid var(--bg2);
      box-shadow: 0 0 0 1px rgba(212,168,67,0.4);
      cursor: ew-resize;
    }
    .bottom-scroll-range::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--gold);
      border: 2px solid var(--bg2);
      box-shadow: 0 0 0 1px rgba(212,168,67,0.4);
      cursor: ew-resize;
    }
    .bottom-scroll-range::-moz-range-track {
      height: 8px;
      border-radius: 999px;
      background: var(--bg3);
      border: 1px solid var(--line2);
    }
    thead tr {
      background: var(--bg3);
      border-bottom: 1px solid var(--line2);
    }
    th {
      font-family: var(--mono);
      font-size: 0.58rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text3);
      text-align: left;
      padding: 9px 12px;
      white-space: nowrap;
      border-right: 1px solid var(--line);
      user-select: none;
    }
    th:last-child { border-right: none; }

    tbody tr {
      border-bottom: 1px solid var(--line);
      transition: background 0.1s;
      cursor: pointer;
    }
    tbody tr:nth-child(4n+1) { background: var(--bg); }
    tbody tr:nth-child(4n+2) { background: var(--bg2); }
    tbody tr:nth-child(4n+3) { background: var(--bg); }
    tbody tr:nth-child(4n+4) { background: var(--bg2); }
    tbody tr.data-row:hover  { background: var(--bg4); }
    tbody tr.data-row.expanded { background: var(--bg4); border-bottom: none; }
    tbody tr.expand-row { background: var(--bg3) !important; }

    td {
      padding: 10px 12px;
      vertical-align: middle;
      border-right: 1px solid var(--line);
      white-space: nowrap;
    }
    td:last-child { border-right: none; }

    td.rn { color:var(--text3); font-size:0.6rem; padding-right:6px; min-width:30px; user-select:none; }

    .td-name {
      font-family: var(--sans);
      font-weight: 600;
      font-size: 0.82rem;
      color: var(--text);
      min-width: 160px;
    }
    .td-name .mentioned {
      display: block;
      font-family: var(--mono);
      font-size: 0.58rem;
      font-weight: 400;
      color: var(--text3);
      margin-top: 1px;
      letter-spacing: 0.06em;
    }

    td.breeding { color:var(--text2); font-style:italic; font-size:0.72rem; min-width:180px; white-space:normal; max-width:220px; }
    td.lot      { color:var(--text3); font-size:0.7rem; min-width:60px; }
    td.price    { font-weight:600; color:var(--gold); min-width:120px; font-variant-numeric:tabular-nums; }
    td.price.ns { color:var(--text3); font-weight:400; }
    td.owner    { color:var(--text2); font-size:0.7rem; min-width:160px; white-space:normal; max-width:200px; }
    td.trainer  { color:var(--blue); font-size:0.72rem; min-width:130px; }
    td.record   { font-variant-numeric:tabular-nums; min-width:80px; text-align:center; }
    td.gender   { text-align:center; min-width:36px; font-size:0.72rem; font-weight:600; color:var(--text2); letter-spacing:0.06em; }
    td.gender.na { color:var(--text3); font-weight:400; }
    td.age      { text-align:center; min-width:32px; font-size:0.72rem; font-weight:600; color:var(--text2); }
    td.age.na   { color:var(--text3); font-weight:400; }
    td.rpr      { font-variant-numeric:tabular-nums; min-width:76px; text-align:center; color:var(--text2); font-size:0.74rem; }
    td.rpr.na   { color:var(--text3); font-style:italic; font-weight:400; }

    .rec-nums { color:var(--text2); font-size:0.72rem; }
    .rec-nums .w { color:var(--green); font-weight:600; }

    .lvl {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 2px;
      font-size: 0.63rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      border: 1px solid transparent;
    }
    .lvl-g1   { color:var(--g1);   border-color:rgba(212,168,67,0.4);  background:rgba(212,168,67,0.1); }
    .lvl-g2   { color:var(--g2);   border-color:rgba(154,176,184,0.4); background:rgba(154,176,184,0.1); }
    .lvl-g3   { color:var(--g3);   border-color:rgba(184,122,58,0.4);  background:rgba(184,122,58,0.1); }
    .lvl-list { color:var(--text2); border-color:var(--line2);          background:var(--bg3); }

    td.toggle-col { width:28px; text-align:center; color:var(--text3); font-size:0.7rem; padding:0 8px; }
    tr.data-row.expanded td.toggle-col { color:var(--gold); }

    /* EXPANDED ROW */
    .expand-row { display: none; }
    .expand-row.open { display: table-row; }
    .expand-row td {
      background: var(--bg3) !important;
      border-bottom: 2px solid var(--line2);
      padding: 0;
      white-space: normal;
    }
    .expand-inner {
      padding: 14px 20px 14px 42px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px,1fr));
      gap: 12px 24px;
      border-left: 3px solid var(--gold);
    }
    .ei-label {
      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text3);
      margin-bottom: 3px;
    }
    .ei-val { font-size: 0.78rem; color: var(--text); line-height: 1.4; }
    .ei-val.gold  { color: var(--gold); font-weight: 600; }
    .ei-val.blue  { color: var(--blue); }

    .ei-record { display:flex; gap:8px; flex-wrap:wrap; }
    .ei-box {
      text-align: center;
      background: var(--bg2);
      border: 1px solid var(--line2);
      border-radius: 2px;
      padding: 6px 10px;
      min-width: 50px;
    }
    .ei-box .bv { font-size:1.1rem; font-weight:600; color:var(--text); line-height:1; }
    .ei-box .bv.g { color:var(--green); }
    .ei-box .bl { font-size:0.55rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--text3); margin-top:3px; }

    /* FOOTER */
    .site-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--line);
      background: var(--bg2);
      display: flex;

      align-items: center;

    @media (max-width: 600px) {

      .conviction-arrow { padding-bottom: 18px; font-size: 1rem; }
    }

    /* ANIMATION */
    .section.active tbody tr {
      animation: rowIn 0.2s ease both;
    }
    @keyframes rowIn {
      from { opacity:0; transform: translateX(-3px); }
      to   { opacity:1; transform: translateX(0); }
    }
    .section.active tbody tr:nth-child(1)  { animation-delay:.02s }
    .section.active tbody tr:nth-child(2)  { animation-delay:.04s }
    .section.active tbody tr:nth-child(3)  { animation-delay:.06s }
    .section.active tbody tr:nth-child(4)  { animation-delay:.08s }
    .section.active tbody tr:nth-child(5)  { animation-delay:.10s }
    .section.active tbody tr:nth-child(6)  { animation-delay:.12s }
    .section.active tbody tr:nth-child(7)  { animation-delay:.14s }
    .section.active tbody tr:nth-child(8)  { animation-delay:.16s }
    .section.active tbody tr:nth-child(n+9) { animation-delay:.18s }
  </style>
</head>

/* ===================================================== */

function isBlackType(h) {
  if ((h.notes || '').toLowerCase().includes('black type')) return true;
  const lvl = (h.highestLevel || '').toUpperCase();
  if (lvl !== 'G1' && lvl !== 'G2' && lvl !== 'G3' && lvl !== 'LISTED') return false;
  return (Number(h.wins) || 0) > 0 || (Number(h.places) || 0) > 0;
}

function levelRank(h) {
  const order = { G1: 0, G2: 1, G3: 2, LISTED: 3 };
  return order[(h.highestLevel || '').toUpperCase()] ?? 9;
}

function sortBlackTypeHorses(list) {
  return [...list].sort((a, b) => {
    const lr = levelRank(a) - levelRank(b);
    if (lr !== 0) return lr;
    const ra = horseRpr(a);
    const rb = horseRpr(b);
    if (ra === null && rb === null) return a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });
    if (ra === null) return 1;
    if (rb === null) return -1;
    if (rb !== ra) return rb - ra;
    return a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });
  });
}

function buildAll() {
  const all = [];
  DATA.sections.forEach(s => {
    if (s.key === 'all' || s.key === 'unraced' || s.key === 'sales-calls' || s.key === 'black-type') return;
    (s.horses||[]).forEach(h => all.push({...h, _section: s.label}));
  });
  BUNDLE_ONLY_ALL.forEach(b => {
    (b.horses||[]).forEach(h => all.push({...h, _section: b.label}));
  });
  const dedupeKey = (h) => `${h.name}|${h.sire||''}|${h.dam||''}`;
  const seen = new Set();
  DATA.sections[0].horses = all.filter(h => {
    const k = dedupeKey(h);
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  });
  const runnersSection = DATA.sections.find(s => s.key === 'runners');
  const unracedSection = DATA.sections.find(s => s.key === 'unraced');
  const hasRun = h => (Number(h.runs) || 0) > 0;
  if (runnersSection) {
    runnersSection.horses = DATA.sections[0].horses.filter(hasRun);
  }
  if (unracedSection) {
    unracedSection.horses = DATA.sections[0].horses.filter(h => !hasRun(h));
  }
  const blackTypeSection = DATA.sections.find(s => s.key === 'black-type');
  if (blackTypeSection) {
    blackTypeSection.horses = DATA.sections[0].horses.filter(isBlackType);
  }
  buildSalesCalls();
}

function horseKey(h) {
  return `${h.name}|${h.sire||''}|${h.dam||''}`;
}

function buildSalesCalls() {
  const section = DATA.sections.find(s => s.key === 'sales-calls');
  const all = DATA.sections[0].horses || [];
  if (!section || !DATA.salesLedger) return;
  const byKey = new Map(all.map(h => [horseKey(h), h]));
  section.horses = DATA.salesLedger.map(entry => {
    const base = byKey.get(horseKey(entry)) || entry;
    const flaggedAt = Number(entry.flaggedAt) || 0;
    const marketAt = Number(entry.marketAt) || 0;
    return { ...base, ...entry, flaggedAt, marketAt, reRate: marketAt - flaggedAt };
  }).sort((a, b) => b.reRate - a.reRate);
}

let sortMode = 'name';
let activeTabKey = 'all';

function sortHorses(list) {
  const sorted = [...list];
  if (sortMode === 'rpr') {
    sorted.sort((a, b) => {
      const ra = horseRpr(a);
      const rb = horseRpr(b);
      if (ra === null && rb === null) return a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });
      if (ra === null) return 1;
      if (rb === null) return -1;
      if (rb !== ra) return rb - ra;
      return a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });
    });
  } else {
    sorted.sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
  }
  return sorted;
}

function isRunnerStyleTab(key) {
  return key === 'runners' || key === 'unraced' || key === 'black-type' || key === 'sales-calls';
}

function fmtMoneyShort(n) {
  const abs = Math.abs(Number(n) || 0);
  if (abs >= 1000000) return `£${(abs / 1000000).toFixed(1)}m`;
  if (abs >= 1000) return `£${Math.round(abs / 1000)}k`;
  return `£${abs}`;
}

function fmtReRate(n) {
  const v = Number(n) || 0;
  if (v === 0) return { text: '—', cls: 'flat' };
  const sign = v > 0 ? '+' : '−';
  return { text: `${sign}${fmtMoneyShort(v)}`, cls: v > 0 ? 'up' : 'down' };
}

function ownerChangeCell(h) {
  const was = h.ownerThen;
  const now = h.ownerNow || h.owner;
  if (!was && !now) return '—';
  if (was && now && was !== now) {
    return `<span class="owner-was">${was}</span><span class="owner-arrow"> → </span><span class="owner-now">${now}</span>`;
  }
  return now || was;
}

function switchTab(key) {
  activeTabKey = key;
  document.querySelectorAll('.stab').forEach(b => b.classList.toggle('active', b.dataset.key === key));
  document.querySelectorAll('.section').forEach(s => s.classList.toggle('active', s.dataset.key === key));
  document.getElementById('sortBar').style.display = key === 'sales-calls' ? 'none' : 'flex';
  syncBottomScrollAfterLayout();
}

function allHorses() {
  return DATA.sections.flatMap(s => s.key==='all' ? [] : (s.horses||[]));
}

function fmtDate(raw) {
  const d = new Date(raw);
  if (isNaN(d)) return raw;
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'2-digit'});
}

function lvlBadge(l) {
  if (!l) return '—';
  const m = {G1:'g1',G2:'g2',G3:'g3',Listed:'list'};
  return `<span class="lvl lvl-${m[l]||'list'}">${l}</span>`;
}

const GENDER_LABELS = { C:'Colt', F:'Filly', M:'Mare', H:'Horse', G:'Gelding' };

function horseGender(h) {
  const raw = h.gender;
  if (raw != null && String(raw).trim() !== '') {
    const g = String(raw).trim().toUpperCase();
    if (GENDER_LABELS[g]) return g;
  }
  const name = (h.name || '').toLowerCase();
  const notes = (h.notes || '').toLowerCase();
  if (/\bfilly\b/.test(name) || /\bfilly\b/.test(notes)) return 'F';
  if (/\bcolt\b/.test(name) || /\bcolt\b/.test(notes)) return 'C';
  if (/\bgelding\b/.test(name) || /\bgelding\b/.test(notes)) return 'G';
  if (/\bmare\b/.test(name) || /\bmare\b/.test(notes)) return 'M';
  if (/\bhorse\b/.test(name) || /\bhorse\b/.test(notes)) return 'H';
  return null;
}

function genderCell(h) {
  const g = horseGender(h);
  if (!g) return { letter: '—', label: '', cls: 'na' };
  return { letter: g, label: GENDER_LABELS[g], cls: '' };
}

// Age = current calendar year − foal year (NH thoroughbred convention: shared 1 Jan
// birthday, so every horse gains a year on 1 Jan). Per-horse `foaled` wins; otherwise
// the tracked cohort's default foal year is used.
function horseAge(h) {
  const foaled = Number(h && h.foaled) || Number(DATA.cohortFoalYear);
  if (!foaled) return null;
  const age = new Date().getFullYear() - foaled;
  return age > 0 && age < 40 ? age : null;
}

function ageCell(h) {
  const a = horseAge(h);
  if (a == null) return { text: '—', label: '', cls: 'na' };
  return { text: String(a), label: `${a}yo`, cls: '' };
}

function rprCell(h) {
  const v = h.highestRpr;
  if (v !== undefined && v !== null && String(v).trim() !== '')
    return { text: String(v).trim(), cls: '' };
  const runs = Number(h.runs);
  const hasRun = h.runs !== undefined && runs > 0;
  if (!hasRun) return { text: 'n/a', cls: 'na' };
  return { text: '—', cls: '' };
}

function horseRpr(h) {
  const v = h.highestRpr;
  if (v === undefined || v === null || String(v).trim() === '') return null;
  const n = Number(v);
  return isNaN(n) ? null : n;
}

function renderStats() {
  const all = DATA.sections[0].horses && DATA.sections[0].horses.length
    ? DATA.sections[0].horses
    : allHorses();
  const wins   = all.reduce((a,h)=>a+(Number(h.wins)||0),0);
  const places = all.reduce((a,h)=>a+(Number(h.places)||0),0);
  const runners = all.filter(h=>Number(h.runs)>0).length;
  const blackType = all.filter(isBlackType).length;
  const hasRun = h => Number(h.runs) > 0;
  const ran = all.filter(hasRun);
  const minRuns = Math.max(1, Number(DATA.rprMinRuns) || 2);
  const mature = ran.filter(h => Number(h.runs) >= minRuns);
  const at90In = list => list.filter(h => {
    const r = horseRpr(h);
    return r !== null && r >= 90;
  }).length;
  const at90Mature = at90In(mature);
  const at90All = at90In(ran);
  const pctMature = mature.length ? Math.round((at90Mature / mature.length) * 1000) / 10 : 0;
  const pctAll = ran.length ? Math.round((at90All / ran.length) * 1000) / 10 : 0;
  const developing = ran.filter(h => Number(h.runs) < minRuns).length;
  const claim = Number(DATA.rprClaimPct) || 39;

  document.getElementById('tb-total').textContent = all.length;
  document.getElementById('tb-wins').textContent  = wins;
  document.getElementById('tb-date').textContent  = fmtDate(DATA.lastUpdated);
  document.getElementById('footerDate').textContent = `Last updated: ${fmtDate(DATA.lastUpdated)}`;

  const cells = [
    { k:'Horses Tracked', v: all.length },
    { k:'Runners',        v: runners },
    { k:'Wins',           v: wins,   cls:'green' },
    { k:'Places',         v: places, cls:'dim' },
    { k:'Black Type',     v: blackType, cls: blackType > 0 ? 'green' : '', sub: 'Listed+ or Group', goto: 'black-type' },
    {
      k:`90+ RPR (${minRuns}+ runs)`,
      v: `${pctMature}%`,
      cls: pctMature >= claim ? 'green' : '',
      sub: `${at90Mature} of ${mature.length} · ${claim}% claim`,
      sub2: developing
        ? `${pctAll}% all runners · ${developing} still on run 1`
        : `${pctAll}% all runners`,
    },
  ];
  document.getElementById('statsRow').innerHTML = cells.map(c=>
    `<div class="stat-cell${c.goto ? ' stat-cell--link' : ''}"${c.goto ? ` data-goto-tab="${c.goto}" role="button" tabindex="0"` : ''}><div class="stat-key">${c.k}</div><div class="stat-val ${c.cls||''}">${c.v}</div>${c.sub ? `<div class="stat-sub">${c.sub}</div>` : ''}${c.sub2 ? `<div class="stat-sub dim-line">${c.sub2}</div>` : ''}</div>`
  ).join('');
}

function bindStatLinks() {
  document.getElementById('statsRow').addEventListener('click', e => {
    const cell = e.target.closest('[data-goto-tab]');
    if (!cell) return;
    const key = cell.dataset.gotoTab;
    switchTab(key);
    document.querySelectorAll('#sectionTabs .stab').forEach(b => {
      b.classList.toggle('active', b.dataset.key === key);
    });
  });
  document.getElementById('statsRow').addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const cell = e.target.closest('[data-goto-tab]');
    if (!cell) return;
    e.preventDefault();
    cell.click();
  });
}

function renderTabs() {
  const el = document.getElementById('sectionTabs');
  el.innerHTML = DATA.sections.map(s =>
    `<button class="stab${s.key===activeTabKey?' active':''}" data-key="${s.key}">${s.label}<span class="stab-count">${sectionHorses(s).length}</span></button>`
  ).join('');

    </div>
  </td>
</tr>`;

function sectionHorses(s) {
  let list = s.horses || [];
  if (s.key === 'runners') list = list.filter(h => (Number(h.runs) || 0) >= 1);
  else if (s.key === 'unraced') list = list.filter(h => (Number(h.runs) || 0) === 0);
  else if (s.key === 'black-type') list = list.filter(isBlackType);
  else if (s.key === 'sales-calls') return list;
  if (s.key === 'black-type') return sortBlackTypeHorses(list);
  return sortHorses(list);
}

function toggleRow(rowId, expId) {
  const row = document.getElementById(rowId);
  const exp = document.getElementById(expId);
  const isOpen = exp.classList.contains('open');
  const table = row.closest('table');
  table.querySelectorAll('.data-row.expanded').forEach(r=>r.classList.remove('expanded'));
  table.querySelectorAll('.expand-row.open').forEach(r=>r.classList.remove('open'));
  if (!isOpen) { row.classList.add('expanded'); exp.classList.add('open'); }
}

let syncingBottom = false;
function activeTableWrap() {
  return document.querySelector('.section.active .table-wrap');
}

function syncBottomScroll() {
  const wrap = activeTableWrap();
  const range = document.getElementById('bottomScrollRange');
  if (!wrap || !range) return;
  const max = Math.max(0, wrap.scrollWidth - wrap.clientWidth);
  range.max = String(max);
  range.value = String(Math.min(max, wrap.scrollLeft));
}

function syncBottomScrollAfterLayout() {
  window.requestAnimationFrame(() => {
    window.requestAnimationFrame(syncBottomScroll);
  });
}

function bindTableScrolls() {
  document.querySelectorAll('.table-wrap').forEach(wrap => {
    wrap.addEventListener('scroll', () => {
      if (syncingBottom) return;
      const active = activeTableWrap();
      if (wrap !== active) return;
      const range = document.getElementById('bottomScrollRange');
      syncingBottom = true;
      range.value = String(wrap.scrollLeft);
      syncingBottom = false;
    });
  });
}

document.getElementById('bottomScrollRange').addEventListener('input', e => {
  if (syncingBottom) return;
  const wrap = activeTableWrap();
  if (!wrap) return;
  syncingBottom = true;
  wrap.scrollLeft = Number(e.target.value || 0);
  syncingBottom = false;
});

window.addEventListener('resize', syncBottomScrollAfterLayout);
window.addEventListener('load', syncBottomScrollAfterLayout);

function updateSortButtons() {
  document.querySelectorAll('#sortBar .sort-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.sort === sortMode);
  });
}

function bindSortBar() {
  document.getElementById('sortBar').addEventListener('click', e => {
    const btn = e.target.closest('.sort-btn');
    if (!btn || btn.dataset.sort === sortMode) return;
    sortMode = btn.dataset.sort;
    updateSortButtons();
    renderTabs();
    renderSections();
    document.getElementById('sortBar').style.display = activeTabKey === 'sales-calls' ? 'none' : 'flex';
  });
}

buildAll();
renderStats();
bindStatLinks();
renderConvictionBuysPanel();
bindSortBar();
bindTabs();
renderTabs();
renderSections();
document.getElementById('sortBar').style.display = activeTabKey === 'sales-calls' ? 'none' : 'flex';
syncBottomScrollAfterLayout();
</script>
</body>
